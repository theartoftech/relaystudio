[package]
name = "relay-studio"
version = "0.1.0"
description = "Relay Studio desktop shell"
authors = ["Relay Studio"]
edition = "2021"
publish = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }

[lib]
name = "relay_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "relay-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
pbkdf2 = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.1"

[dev-dependencies]
tempfile = "3"
