name: Release Gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:types
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run test:component
      - run: npm run build
      - run: npm run check:secrets
      - run: npm run check:documentation
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e

  rust-quality:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: rustup default stable
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo +nightly llvm-cov --manifest-path src-tauri/Cargo.toml --all-features --workspace --ignore-filename-regex 'src/main.rs' --fail-under-lines 90

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check:licenses
      - run: cargo deny --manifest-path src-tauri/Cargo.toml check
      - run: npm run check:secrets
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  live-rest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Materialize local-only live REST configuration
        id: live-rest-config
        env:
          LIVE_REST_CONFIG_B64: ${{ secrets.RELAY_LIVE_REST_CONFIG_B64 }}
        run: |
          if [ -n "$LIVE_REST_CONFIG_B64" ]; then
            printf '%s' "$LIVE_REST_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/live-rest.json"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run configured live REST acceptance suite
        if: steps.live-rest-config.outputs.configured == 'true'
        env:
          RELAY_LIVE_REST_CONFIG: ${{ runner.temp }}/live-rest.json
        run: npm run test:live-rest
      - name: Report missing live REST configuration
        if: steps.live-rest-config.outputs.configured == 'false'
        run: echo "Live REST acceptance not configured; release packaging remains blocked."
