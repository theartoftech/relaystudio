name: Package Beta

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-beta.*"

permissions:
  contents: read

concurrency:
  group: package-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-rest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIVE_REST_CONFIG_B64: ${{ secrets.RELAY_LIVE_REST_CONFIG_B64 }}
    steps:
      - name: Require live REST configuration
        if: env.LIVE_REST_CONFIG_B64 == ''
        run: |
          echo "Live REST configuration is required before beta packaging."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Materialize protected live REST configuration
        run: printf '%s' "$LIVE_REST_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/live-rest.json"
      - name: Run configured live REST acceptance suite
        env:
          RELAY_LIVE_REST_CONFIG: ${{ runner.temp }}/live-rest.json
        run: npm run test:live-rest

  package:
    needs: live-rest
    name: ${{ matrix.name }} beta package
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            bundles: dmg
            artifact: relay-studio-macos-beta
            paths: src-tauri/target/release/bundle/dmg/*.dmg
          - name: Windows
            os: windows-latest
            bundles: nsis,msi
            artifact: relay-studio-windows-beta
            paths: |
              src-tauri/target/release/bundle/nsis/*-setup.exe
              src-tauri/target/release/bundle/msi/*.msi
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,appimage
            artifact: relay-studio-linux-beta
            paths: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run verify
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build unsigned beta installer
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
      - name: Retain native beta installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14
