[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = [
  { id = "RUSTSEC-2026-0194", reason = "quick-xml is transitively pinned by Tauri plist; Relay Studio does not parse user-controlled XML. Remove when plist accepts quick-xml >=0.41.0." },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml is transitively pinned by Tauri plist; Relay Studio does not use NsReader on user-controlled XML. Remove when plist accepts quick-xml >=0.41.0." }
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib"
]
private = { ignore = true }
exceptions = [
  { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] }
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
